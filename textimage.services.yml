services:
  _defaults:
    autowire: true
  cache.textimage:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: ['textimage']
  logger.channel.textimage:
    parent: logger.channel_base
    arguments: ['textimage']
  Drupal\textimage\PathProcessor\TextimagePathProcessor:
    tags:
      - { name: path_processor_inbound, priority: 300 }
  Drupal\textimage\TextimageFactoryInterface:
    class: Drupal\textimage\TextimageFactory
  Drupal\textimage\TextimageLogger: ~

  path_processor.textimage:
    alias: Drupal\textimage\PathProcessor\TextimagePathProcessor
    deprecated: 'The "%alias_id%" service alias is deprecated. Use "Drupal\textimage\PathProcessor\TextimagePathProcessor" service id instead.'
  textimage.factory:
    alias: Drupal\textimage\TextimageFactoryInterface
    deprecated: 'The "%alias_id%" service alias is deprecated. Use "Drupal\textimage\TextimageFactoryInterface" service id instead.'
  textimage.logger:
    alias: Drupal\textimage\TextimageLogger
    deprecated: 'The "%alias_id%" service alias is deprecated. Use "Drupal\textimage\TextimageLogger" service id instead.'
