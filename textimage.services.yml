services:
  cache.textimage:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: [textimage]
  logger.channel.textimage:
    parent: logger.channel_base
    arguments: ['textimage']
  plugin.manager.textimage.font:
    class: Drupal\textimage\Plugin\TextimagePluginManager
    arguments: [font, '@container.namespaces', '@cache.discovery', '@module_handler', '@config.factory']
  plugin.manager.textimage.background:
    class: Drupal\textimage\Plugin\TextimagePluginManager
    arguments: [background, '@container.namespaces', '@cache.discovery', '@module_handler', '@config.factory']
  plugin.manager.textimage.color:
    class: Drupal\textimage\Plugin\TextimagePluginManager
    arguments: [color, '@container.namespaces', '@cache.discovery', '@module_handler', '@config.factory']
  textimage.factory:
    class: Drupal\textimage\TextimageFactory
    arguments: ['@config.factory', '@token', '@textimage.logger', '@cache.textimage', '@current_user', '@plugin.manager.image.effect', '@stream_wrapper_manager', '@entity.manager']
  textimage.logger:
    class: Drupal\textimage\TextimageLogger
    arguments: ['@config.factory', '@logger.channel.textimage', '@current_user']
